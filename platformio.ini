[platformio]
default_envs = due

[env:due]
platform = atmelsam
board = due
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library@^3.0.2
build_flags =
    -std=gnu++11

[env:native]
platform = native
test_build_src = yes
build_src_filter =
    +<servo_system.cpp>
    +<command_parser.cpp>
build_flags =
    -std=c++11
    -I include
